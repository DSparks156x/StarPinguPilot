# StarPinguPilot: build device binaries on GitHub's free ARM runners and push a prebuilt "build" commit.
# StarPilot's own compile_starpilot.yaml needs the maintainer's self-hosted runner; this uses the same
# scripts/laptop_device_build.sh flow with a sysroot extracted from the AGNOS system image.
#
# READ THIS BEFORE CHANGING NATIVE CODE (C/C++, Cython, capnp, cereal/services.py, SConscript):
#
# - The comma can't compile StarPilot (AGNOS has no dev headers). It runs the binaries committed to this branch:
#   launch_chffrplus.sh only runs ./build when there is no `prebuilt` file, and the tree always has one. A native
#   change therefore reaches the car only if this workflow rebuilds the binary that contains it and commits it.
#
# - A full build is slow, so the default build is an explicit list of targets: BUILD_ARGS in scripts/pingu_ci.py
#   (params, panda firmware, cereal libs/services.h/bridge, loggerd/encoderd/bootlog). Everything else
#   (pandad, camerad, modeld/controls/locationd libs, msgq, ...) stays as committed.
#
# - The guard step fails the run if native sources changed since the last build-bot commit that the list doesn't
#   cover (COVERED/IGNORED in scripts/pingu_ci.py: a static path list, checked in milliseconds, before any build).
#   The fix is either to add the target, or to dispatch this workflow with full_build=true (which skips the guard).
#   Try it locally: python3 scripts/pingu_ci.py guard <base>..<head>
#
# - To add a target: append its scons path (or a ./build flag) to BUILD_ARGS in scripts/pingu_ci.py and add the
#   source paths it covers to COVERED. Only cover a path if every shipped binary it can change is in the list.
#
# - After the build, the verify step fails the run if cereal/services.h doesn't match services.py, or if loggerd
#   doesn't contain every should_log service (loggerd only logs services compiled into it).
#
# - Upstream StarPilot merges bring upstream-built binaries, which don't know fork-only services (starpilotLightState)
#   or other fork changes. The default list always rebuilds the cereal/loggerd binaries, so those get fixed on the
#   next push. If the merge also touched native code outside the list, the guard fires: rebuild those targets
#   (add them, or run full_build=true) before driving with that merge.
name: Build StarPinguPilot

on:
  push:
    branches: [pingu]
  workflow_dispatch:
    inputs:
      full_build:
        description: "Full build (default only builds the target list in scripts/pingu_ci.py)"
        type: boolean
        default: false

concurrency:
  group: build-pingu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  IMAGE_NAME: starpilot-larch64-builder:latest

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      # Full history for the guard, but blobless: only commits and trees, file contents for HEAD only
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Guard native sources against the build list
        if: ${{ inputs.full_build != true }}
        env:
          GUARD_FALLBACK_BASE: ${{ github.event.before }}
        run: python3 scripts/pingu_ci.py guard

      # Builder image layers live in the GitHub Actions cache
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/laptop_device_build/Dockerfile
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}
          load: true
          cache-from: type=gha,scope=pingu-builder
          cache-to: type=gha,mode=max,scope=pingu-builder

      # The sysroot only changes when the AGNOS version does
      - name: Restore AGNOS sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: .comma_sysroot
          key: agnos-sysroot-${{ hashFiles('system/hardware/tici/agnos.json', 'tools/laptop_device_build/extract_sysroot_from_agnos.py') }}

      - name: Extract AGNOS sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          scripts/laptop_device_build.sh setup-sysroot-agnos
          rm -rf .cache/agnos

      - name: Restore Python venv
        uses: actions/cache@v4
        with:
          path: |
            .venv-linux-arm64
            .cache/uv
          key: uv-venv-${{ hashFiles('uv.lock') }}

      - name: Build
        run: |
          if [[ "${{ inputs.full_build }}" == "true" ]]; then
            ./build "$(nproc)"
          else
            ./build $(python3 scripts/pingu_ci.py build-args)
          fi
          touch prebuilt

      - name: Verify build output
        run: python3 scripts/pingu_ci.py verify

      - name: Commit and push build output
        run: |
          # Skip if the branch moved on while building; the newer push gets its own build
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            echo "${GITHUB_REF_NAME} moved to ${remote_head} while building ${GITHUB_SHA}, not pushing."
            exit 0
          fi
          git config user.name "StarPinguPilot Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add -f prebuilt
          git status --short
          if git diff --cached --quiet; then
            if [[ "${{ inputs.full_build }}" != "true" ]]; then
              echo "No build output changes."
              exit 0
            fi
            # A full build always commits, so the guard's base (the last bot commit) moves past what it covered
            git commit --allow-empty -m "build (full, no changes)"
          else
            git commit -m "build"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
